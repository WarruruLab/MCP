services:
  mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS}
      DEVLOG_BASE_URL: ${DEVLOG_BASE_URL}
      DEVLOG_INTERNAL_API_KEY: ${DEVLOG_INTERNAL_API_KEY}
      DEVLOG_TIMEOUT_SECONDS: ${DEVLOG_TIMEOUT_SECONDS}
      MCP_CORS_ALLOW_ORIGINS: ${MCP_CORS_ALLOW_ORIGINS}
      MCP_APPEND_PROMPT_FILE: ${MCP_APPEND_PROMPT_FILE}
      MCP_APPEND_PROMPT_TEMPLATE: ${MCP_APPEND_PROMPT_TEMPLATE}
      MCP_NARRATIVE_PROMPT_FILE: ${MCP_NARRATIVE_PROMPT_FILE}
      MCP_NARRATIVE_PROMPT_TEMPLATE: ${MCP_NARRATIVE_PROMPT_TEMPLATE}
    ports:
      - "${MCP_HOST_PORT:-8000}:8000"
    volumes:
      - "${MCP_PROMPTS_DIR:-./prompts}:/prompts:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - warruru-shared

networks:
  warruru-shared:
    name: warruru-shared
    external: true
