services:
  mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_ANALYSIS_VERSION: ${MCP_ANALYSIS_VERSION}
      MCP_DEFAULT_MAX_RECENT_MESSAGES: ${MCP_DEFAULT_MAX_RECENT_MESSAGES}
      MCP_DEFAULT_MAX_CANDIDATE_BLOCKS: ${MCP_DEFAULT_MAX_CANDIDATE_BLOCKS}
      MCP_ROUTING_APPEND_THRESHOLD: ${MCP_ROUTING_APPEND_THRESHOLD}
      MCP_ROUTING_TAIL_LIMIT: ${MCP_ROUTING_TAIL_LIMIT}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_ROUTE_MODEL: ${OLLAMA_ROUTE_MODEL}
      OLLAMA_ROUTE_TIMEOUT_SECONDS: ${OLLAMA_ROUTE_TIMEOUT_SECONDS}
      OLLAMA_ROUTE_TEMPERATURE: ${OLLAMA_ROUTE_TEMPERATURE}
      OLLAMA_METADATA_MODEL: ${OLLAMA_METADATA_MODEL}
      OLLAMA_METADATA_TIMEOUT_SECONDS: ${OLLAMA_METADATA_TIMEOUT_SECONDS}
      OLLAMA_METADATA_TEMPERATURE: ${OLLAMA_METADATA_TEMPERATURE}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS}
      DEVLOG_BASE_URL: ${DEVLOG_BASE_URL}
      DEVLOG_INTERNAL_API_KEY: ${DEVLOG_INTERNAL_API_KEY}
      DEVLOG_TIMEOUT_SECONDS: ${DEVLOG_TIMEOUT_SECONDS}
      MCP_CORS_ALLOW_ORIGINS: ${MCP_CORS_ALLOW_ORIGINS}
      MCP_ROUTE_PROMPT_FILE: ${MCP_ROUTE_PROMPT_FILE}
      MCP_ROUTE_PROMPT_TEMPLATE: ${MCP_ROUTE_PROMPT_TEMPLATE}
      MCP_METADATA_PROMPT_FILE: ${MCP_METADATA_PROMPT_FILE}
      MCP_METADATA_PROMPT_TEMPLATE: ${MCP_METADATA_PROMPT_TEMPLATE}
      MCP_APPEND_PROMPT_FILE: ${MCP_APPEND_PROMPT_FILE}
      MCP_APPEND_PROMPT_TEMPLATE: ${MCP_APPEND_PROMPT_TEMPLATE}
      MCP_NARRATIVE_PROMPT_FILE: ${MCP_NARRATIVE_PROMPT_FILE}
      MCP_NARRATIVE_PROMPT_TEMPLATE: ${MCP_NARRATIVE_PROMPT_TEMPLATE}
      DEVLOG_DB_CONTAINER: ${DEVLOG_DB_CONTAINER}
      DEVLOG_DB_NAME: ${DEVLOG_DB_NAME}
      DEVLOG_DB_USER: ${DEVLOG_DB_USER}
      DEVLOG_DB_PASSWORD: ${DEVLOG_DB_PASSWORD}
      LOCAL_LLM_TEST_SESSION_TITLE: ${LOCAL_LLM_TEST_SESSION_TITLE}
    ports:
      - "${MCP_HOST_PORT:-8000}:8000"
    volumes:
      - "${MCP_PROMPTS_DIR:-./prompts}:/prompts:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - warruru-shared

networks:
  warruru-shared:
    name: warruru-shared
    external: true
